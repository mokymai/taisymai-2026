name: Netikslumas teorijos svetainėje
description: "Pranešimas apie netikslumą svetainėje mokymai.github.io/konspektas arba mokymai.github.io/biostatistika"
title: '[teorija] netikslumas → taisymas (netikslumo esmė)'
labels: ["Naujas :new:", "Vieta: teorijos svetainė :globe_with_meridians:"]
body:
  - type: markdown
    attributes:
      value: |
          Temos **pavadinime** apibūdinkite netikslumo esmę, kuri padėtų **kitiems** skaitytojams **greitai susiorientuoti**, kad apie šį netikslumą jau pranešta.

          1. Palikite dalį „`[teorija]`“;
          2. Apibūdinkite netikslumo esmę. Jei galima, tokiu formatu: netikslumas → taisymas;
          Pvz.:
          „[teorija] kopppiuteris → kompiuteris (rašyba)“
          „[teorija] praleistas žodis "tačiau"“
  - type: dropdown
    id: website
    attributes:
      label: Svetainė
      options:
        - /konspektas
        - /biostatistika
      default: 0
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Nuoroda
      description: Tiksli nuoroda iš pasirinktos svetainės.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Ekrano nuotrauka su pažymėta netikslumo vieta
      description: Įkelkite vieną ar kelias ekrano nuotraukas („Screenshot“) su pažymėta netikslumo vieta. Galite įklijuoti paspausdami Ctrl+V.
    validations:
      required: true
  - type: dropdown
    id: error-type
    attributes:
      label: Netikslumo tipas
      description: Pasirinkite vieną ar kelis.
      multiple: true
      options:
        - rašyba (praleista raidė ar kt.)
        - gramatika (nesuderinti linksniai ar kt.)
        - praleistas žodis
        - pasikartojimas (pasikartojantis žodis ar frazė)
        - skaičiavimo klaida
        - numeracijos klaida
        - fakto klaida
        - netinkamas terminas
        - skyryba
        - stilius
        - kita
    validations:
      required: true
  - type: input
    id: error-with-context
    attributes:
      label: Netikslumo tekstas su keliais žodžiais aplinkui
      description: To reikia greitai paieškai dokumente.
  - type: input
    id: error
    attributes:
      label: Netikslumo tekstas
  - type: input
    id: correction
    attributes:
      label: Siūlomas taisymo tekstas
  - type: textarea
    id: comment
    attributes:
      label: Komentaras
      description: Jei reikia, pateikite papildomos informacijos.
  - type: dropdown
    id: course
    attributes:
      label: Dalykas
      options:
        - BS-2026
        - kitas
      default: 0
    validations:
      required: true
  - type: dropdown
    id: teacher
    attributes:
      label: Dėstytojas
      options:
        - Vilmantas
        - Rimantė
        - Justinas
        - Vita
        - kitas
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Patvirtinimas
      options:
        - label: Temos pavadinimą pakeičiau ir jame nurodžiau konkrečios problemos esmę.
          required: true
        - label: "Apie šią problemą dar niekas nėra pranešęs: esu pirmasis/pirmoji."
