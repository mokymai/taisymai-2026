name: Validate issue titles

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  validate-slide-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate slide issue title
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title;
            const isSlideIssue = title.startsWith('P') || title.startsWith('p');
            if (!isSlideIssue) {
              return;
            }

            const titlePattern = /^P\d{2}-\d{1,2} \(v\d+\.\d+\) sk\.\d{1,3}(?:,\d{1,3})*: .+$/u;
            const placeholderPattern = /P__-_|sk\._|netikslumas → taisymas|\(esmė\)/u;
            const isValid = titlePattern.test(title) && !placeholderPattern.test(title);
            const labelName = 'reikia pataisyti';
            const marker = '<!-- slide-title-validation -->';

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: 'd73a4a',
                description: 'Issue pavadinimą reikia pataisyti.'
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }

            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            const hasValidationComment = comments.some((comment) => comment.body?.includes(marker));

            if (!isValid) {
              if (!labels.includes(labelName)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: [labelName]
                });
              }

              if (!hasValidationComment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `${marker}\n\nPrašome pataisyti temos pavadinimą pagal formatą:\n\n\`P01-4 (v1.0) sk.14: netikslumas → taisymas (esmė)\`\n\nPavadinime neturi likti šabloninių dalių \`netikslumas → taisymas\` ar \`(esmė)\`. Pataisius pavadinimą, etiketė \`reikia pataisyti\` bus nuimta automatiškai.`
                });
              }
              return;
            }

            if (labels.includes(labelName)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: labelName
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\n\nPavadinimas pataisytas. Etiketė \`reikia pataisyti\` nuimta.`
              });
            }
